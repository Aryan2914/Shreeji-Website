services:
  # MySQL 8.0 Database
  mysql:
    image: mysql:8.0
    container_name: shreeji-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: shreeji_root_2024
      MYSQL_DATABASE: shreeji_db
      MYSQL_USER: shreeji
      MYSQL_PASSWORD: shreeji_db_pass
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 7 (Cache + Queues + Sessions)
  redis:
    image: redis:7-alpine
    container_name: shreeji-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Meilisearch (Full-text product search)
  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: shreeji-meilisearch
    restart: unless-stopped
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: shreeji_search_master_key_2024
      MEILI_ENV: development
      MEILI_DB_PATH: /meili_data
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Mailpit (Local email testing — catches all outbound emails)
  mailpit:
    image: axllent/mailpit:latest
    container_name: shreeji-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"  # Web UI
      - "1025:1025"  # SMTP
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  # phpMyAdmin (optional — database management)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: shreeji-phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: shreeji
      PMA_PASSWORD: shreeji_db_pass
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  meilisearch_data:
    driver: local
